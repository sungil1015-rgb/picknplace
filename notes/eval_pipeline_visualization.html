<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">

:root{--ink:#15181f;--sub:#5b6472;--line:#cbd2dc;--blue:#2563eb;--blue-bg:#e8f0fe;

body{margin:0;background:#f5f6f8;color:var(--ink);font-family:var(--sans);line-height:1.55}
.wrap{max-width:1340px;margin:0 auto;padding:46px 26px 80px}
header.doc{border-bottom:2px solid var(--ink);padding-bottom:18px;margin-bottom:6px}
header.doc h1{font-family:'Times New Roman',Georgia,serif;font-size:29px;margin:0 0 6px;letter-spacing:-.2px}
header.doc .sub{color:var(--sub);font-size:14.5px}
header.doc .meta{margin-top:10px;font-family:var(--mono);font-size:12px;color:var(--sub)}
figure{margin:44px 0 0;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 1px 2px rgba(20,24,31,.04);overflow:hidden}
.fig-head{padding:16px 22px 12px;border-bottom:1px solid var(--line);background:#fafbfc}
.fig-tag{display:inline-block;font-family:var(--mono);font-size:11px;font-weight:700;letter-spacing:.12em;color:#fff;background:var(--ink);padding:3px 9px;border-radius:4px}
.fig-title{font-family:'Times New Roman',Georgia,serif;font-size:21px;margin:9px 0 2px}
.fig-kicker{color:var(--sub);font-size:13px;line-height:1.5}
.svg-host{padding:18px 16px 6px;overflow-x:auto}
svg{display:block;margin:0 auto;max-width:100%;height:auto}
figcaption{padding:15px 24px 20px;font-size:13px;color:#2b313c;border-top:1px dashed var(--line)}
figcaption .mono,.mono{font-family:var(--mono);font-size:12px}
.hl{background:linear-gradient(transparent 60%,#fdf3e3 0);font-weight:700}
.muted{color:var(--sub)}
.legend{display:flex;flex-wrap:wrap;gap:9px 16px;padding:12px 24px;background:#fafbfc;border-top:1px solid var(--line);font-size:12px;color:var(--sub)}

.box--warn{background:var(--amber-bg);border-color:var(--amber)}
.box--info{background:var(--indigo-bg);border-color:var(--indigo)}
.kpi{font-size:28px;font-weight:800}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
@media print{body{background:#fff}figure{break-inside:avoid;box-shadow:none}}
</style></head>
<body><div class="wrap">
<header class="doc">
  <h1>Binpicking DINOv2 End-to-End 파이프라인: 구조 분해 논문 Figure 세트 (9장)</h1>
  <div class="sub">binpicking <b>DINOv2-large · layer 12 · dim 1024</b> 파이프라인 — 분류 + 불량탐지 로직 + 실측 평가지표를 end-to-end 한 흐름으로 분해</div>
  <div class="meta">Seg n=57 · 시간 n=182 · 분류 예측 count 기준 · 모든 수치 현 평가 기준 잠정 · 불량탐지 정량 FP는 뱅크 통합 후</div>
</header>
<figure>
  <div class="fig-head">
    <span class="fig-tag">FIGURE 1</span>
    <div class="fig-title">End-to-End Binpicking 파이프라인 개요 — 단일 backbone forward 공유 5스테이지</div>
    <div class="fig-kicker">Mask2Former 분할 → DINOv2-large backbone(layer12·dim1024, 1 forward) → 분류(CLS KNN + unknown gating) → 불량탐지(PatchCore per-class) → grasp priority/suction. backbone 1회 forward로 분류·불량탐지가 layer를 공유한다. 단계별 mean 추론시간(n=182, sec).</div>
  </div>

  <div class="svg-host">
    <svg viewBox="0 0 1100 360" width="100%" role="img" aria-label="binpicking 5스테이지 수평 파이프라인 플로우">
      <defs>
        <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#5b6472"/>
        </marker>
        <marker id="ahb" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0,0 L10,5 L0,10 z" fill="#4338ca"/>
        </marker>
      </defs>

      <!-- 표본 chip 우상단 -->
      <g>
        <rect x="980" y="10" width="108" height="24" rx="12" fill="#eef0fc" stroke="#4338ca" stroke-width="1"/>
        <text x="1034" y="26" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#4338ca">n = 182</text>
      </g>

      <!-- ① Segmentation -->
      <g>
        <rect x="20" y="118" width="170" height="96" rx="14" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.4"/>
        <circle cx="44" cy="142" r="11" fill="#2563eb"/>
        <text x="44" y="146" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="700">1</text>
        <text x="105" y="146" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#15181f" font-weight="700">분할</text>
        <text x="105" y="166" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#5b6472">Mask2Former</text>
        <text x="105" y="194" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#5b6472">IoU 0.897·F1 0.888</text>
        <text x="105" y="236" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#2563eb">0.169s</text>
      </g>

      <!-- arrow ①→② -->
      <line x1="190" y1="166" x2="232" y2="166" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ah)"/>

      <!-- ② Backbone (중앙 강조, 폭 넓게) -->
      <g>
        <rect x="234" y="98" width="246" height="136" rx="16" fill="#eef0fc" stroke="#4338ca" stroke-width="2"/>
        <circle cx="262" cy="124" r="11" fill="#4338ca"/>
        <text x="262" y="128" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="700">2</text>
        <text x="357" y="128" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="14" fill="#15181f" font-weight="700">DINOv2-large backbone</text>
        <text x="357" y="150" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="11.5" fill="#4338ca">layer12 · dim1024</text>
        <rect x="300" y="166" width="114" height="22" rx="11" fill="#ffffff" stroke="#4338ca" stroke-width="1"/>
        <text x="357" y="181" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#4338ca" font-weight="600">1 forward 공유</text>
        <text x="357" y="212" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#5b6472">CLS 0.7 + patch_mean 0.3 / patch L2</text>
      </g>

      <!-- ② 분기 → ③ (상), → ④ (하) -->
      <path d="M480,140 C520,140 530,116 568,116" fill="none" stroke="#4338ca" stroke-width="1.4" marker-end="url(#ahb)"/>
      <path d="M480,192 C520,192 530,216 568,216" fill="none" stroke="#4338ca" stroke-width="1.4" marker-end="url(#ahb)"/>
      <text x="530" y="100" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#4338ca">layer12·dim1024 공유</text>
      <text x="530" y="244" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="10.5" fill="#4338ca">layer12·dim1024 공유</text>

      <!-- ③ 분류 (상단 분기) -->
      <g>
        <rect x="570" y="70" width="172" height="92" rx="14" fill="#e9f6f0" stroke="#047857" stroke-width="1.4"/>
        <circle cx="594" cy="94" r="11" fill="#047857"/>
        <text x="594" y="98" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="700">3</text>
        <text x="656" y="98" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#15181f" font-weight="700">분류</text>
        <text x="656" y="117" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#5b6472">CLS KNN + unknown gating</text>
        <text x="656" y="135" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#5b6472">6클래스(0~4 + unknown)</text>
        <text x="656" y="153" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#047857">0.198s</text>
      </g>

      <!-- ④ 불량탐지 (하단 분기) — 잠정 chip -->
      <g>
        <rect x="570" y="194" width="172" height="98" rx="14" fill="#fdf3e3" stroke="#b45309" stroke-width="1.4"/>
        <circle cx="594" cy="218" r="11" fill="#b45309"/>
        <text x="594" y="222" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="700">4</text>
        <text x="650" y="222" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#15181f" font-weight="700">불량탐지</text>
        <rect x="690" y="201" width="46" height="20" rx="10" fill="#fdecea" stroke="#c0392b" stroke-width="1"/>
        <text x="713" y="215" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#c0392b" font-weight="700">잠정</text>
        <text x="656" y="241" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#5b6472">PatchCore per-class</text>
        <text x="656" y="258" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#5b6472">patch L2 nn-dist &gt; τ</text>
        <text x="656" y="282" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#c0392b">1.205s ● 병목</text>
      </g>

      <!-- ③·④ → ⑤ 병합 -->
      <path d="M742,116 C788,116 800,150 836,150" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ah)"/>
      <path d="M742,243 C788,243 800,182 836,182" fill="none" stroke="#5b6472" stroke-width="1.4" marker-end="url(#ah)"/>

      <!-- ⑤ grasp -->
      <g>
        <rect x="838" y="118" width="170" height="96" rx="14" fill="#e8f0fe" stroke="#2563eb" stroke-width="1.4"/>
        <circle cx="862" cy="142" r="11" fill="#2563eb"/>
        <text x="862" y="146" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="12" fill="#ffffff" font-weight="700">5</text>
        <text x="923" y="146" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="13" fill="#15181f" font-weight="700">grasp</text>
        <text x="923" y="166" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10.5" fill="#5b6472">priority / suction</text>
        <text x="923" y="194" text-anchor="middle" font-family="system-ui,Arial,sans-serif" font-size="10" fill="#5b6472">우선순위 결정</text>
        <text x="923" y="236" text-anchor="middle" font-family="ui-monospace,Menlo,monospace" font-size="12" fill="#2563eb">0.014s</text>
      </g>

      <!-- 최하단 타임라인 막대: 총 1.601s 비례 분할 -->
      <g>
        <text x="20" y="318" font-family="system-ui,Arial,sans-serif" font-size="11" fill="#5b6472">단계별 시간 비례 (총 1.601s, 디버그 포함 · n=182)</text>

  </div>

  <figcaption>
    <span class="hl">FIGURE 1.</span> 좌→우 수평 5스테이지 파이프라인. <span class="mono">DINOv2-large</span> backbone(②)은 <span class="mono">layer12·dim1024</span>를 단일 forward로 산출해 분류(③)와 불량탐지(④)가 동일 layer feature를 공유한다. 단계별 mean 추론시간(<span class="mono">n=182</span>): seg <span class="mono">0.169s</span> · classifi <span class="mono">0.198s</span> · normal(불량탐지) <span class="mono">1.205s</span>(<span class="hl">병목, 전체의 약 75%</span>) · prior <span class="mono">0.014s</span> · run <span class="mono">1.135s</span> · 디버그 포함 총 <span class="mono">1.601s</span>.
    <span class="chip muted">정직성 단서</span> 분류·분할·시간·메모리는 실측이며, 불량탐지(PatchCore)의 정량 false-positive 평가는 서버/뱅크 통합 후 산출 예정 — 현재 <span class="hl">잠정</span>.
    <div class="legend">
      <span class="chip box--info">① 분할 Mask2Former</span>
      <span class="chip" style="background:#eef0fc;color:#4338ca">② backbone DINOv2-large</span>
      <span class="chip box--ok">③ 분류 CLS KNN</span>
      <span class="chip box--warn">④ 불량탐지 PatchCore (잠정)</span>
      <span class="chip box--info">⑤ grasp priority</span>
    </div>
  </figcaption>
</figure>
<figure>
  <div class="fig-head">
    <span class="fig-tag">FIGURE 2</span>
    <div class="fig-title">DINOv2-large 백본 1회 Forward — 두 Head가 동일 토큰열 공유</div>
    <div class="fig-kicker">layer12 · dim1024 · 1× forward로 CLS→분류 / patch→불량탐지 분기. 별도 backbone 호출 없음이 시간 절감의 핵심.</div>
  </div>
  <div class="svg-host">
    <svg viewBox="0 0 1080 460" width="100%" role="img" aria-label="DINOv2-large 1 forward 공유 도식" font-family="-apple-system,Segoe UI,Roboto,sans-serif">

        </marker>
      </defs>

      <!-- ===== 좌측: 입력 패치 그리드 ===== -->

      <text x="92" y="80" font-size="10.5" fill="#5b6472" text-anchor="middle">(Mask2Former crop)</text>

      <text x="252" y="80" font-size="10.5" fill="#5b6472" text-anchor="middle">12 layers · dim1024</text>

      <!-- ===== 토큰열 ===== -->
      <text x="408" y="64" font-size="12" font-weight="600" fill="#15181f" text-anchor="middle">토큰열</text>
      <text x="408" y="80" font-size="10.5" fill="#5b6472" text-anchor="middle">CLS + N patch · 각 dim1024</text>
      <!-- CLS 토큰 -->
      <rect x="362" y="150" width="92" height="22" rx="3" fill="#fdecea" stroke="#c0392b" stroke-width="1.4"/>
