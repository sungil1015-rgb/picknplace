camera:
  intrinsics:
    fx: 1242.55
    fy: 1242.77
    cx: 605.119
    cy: 502.016
  resolution:
    width: 1224
    height: 1024
suction:
  cup_od_mm: 26.0
  cup_pitch_mm: 40
  safety_offset_mm: 2.0
  head_clearance_mm: 5.0
  arm_box_scale: 1.3
  arm_box_height_mm: 200.0
approach:
  max_tilt_deg: 55
  top_surface_percentile: 95
  top_surface_band_mm: 5.0
  refine_max_offset_mm: 10.0
classes:
  # 2026-05-17 Drive(jew0201) 기준 nc=6 + object 추가. cid 매핑 갱신:
  #   0 bottle (옛 3) / 1 haribo (옛 0) / 2 mango (옛 1)
  #   3 metal_case (옛 4) / 4 object (신규) / 5 pencil_case (옛 2)
  names:
  - bottle
  - haribo
  - mango
  - metal_case
  - object
  - pencil_case
  exclude_cids: []
  bottle_cid: 0
  priors:
    bottle: 0.0
    haribo: 0.7
    mango: 0.85
    metal_case: 0.95
    object: 0.5
    pencil_case: 0.95
confidence:
  weights:
    cup_support: 0.1
    normal_std: 0.205
    size_margin: 0.3
    class_prior: 0.091
    occlusion_clear: 0.304
  tier_high: 0.7
  tier_medium: 0.5
gates:
  s1_overlap_defer: 0.1
  # 로봇 접근경로 충돌 검사(arm box / 컵 진입경로 protrusion) ON/OFF.
  # 로봇 컨트롤러가 좌표 받으면 경로 충돌을 자체 회피하므로 기본 OFF(중복·과거부 방지).
  # true로 켜면 s2_arm_protrusion_mm / s2_cup_protrusion_mm 게이트가 다시 적용됨.
  robot_path_collision_check: false
  # single-cup 픽에서 "파지 안 하는 컵(dead cup B)" 하강 경로 충돌 검사.
  # robot_path_collision_check와 무관(독립) — 로봇은 단일 파지점(cup A)만 받아
  # 노는 cup B를 모델링 못 하므로 이 자가충돌은 우리가 막아야 함. 기본 ON.
  single_cup_dead_cup_check: true
  single_cup_dead_cup_descent_mm: 150.0   # cup B 하강 원기둥 높이(표면 위 mm)
  single_cup_dead_cup_protrusion_mm: 10.0 # 이 이상 솟은 self 아닌 점 = 충돌
  s2_arm_protrusion_mm: 10.0
  s2_cup_protrusion_mm: 5.0
  s2_cup_bump_mm: 7.0
  s2_cup_coverage_min: 0.55
  s2_cup_rim_min: 0.9
  s2_cup_rim_min_per_class:
    haribo: 0.7
    mango: 0.7
  s2_cup_rim_dilate_px: 2
  s2_rect_planarity_mm: 7.0
  s2_corner_protrusion_mm: 40.0
  s2_corner_nan_ratio: 0.7
  s2_corner_min_fails: 2
  s2_neighbor_radius_mm: 40.0
  s2_neighbor_band_mm: 10.0
  s2_neighbor_max_points: 20
  length_defer: true
  single_cup_cids:
  - 0
  - 1
  - 3
  cup_support_min_points: 5
  s3_flatness_min: 0.8
  s4_nan_ratio_reject: 0.25
  s4_nan_ratio_reject_bottle: 0.15
occlusion:
  depth_jump_mm: 5.0
  normal_offset_px: 8
  sample_step_px: 4
  clear_hard_reject: 0.5
recovery:
  enable: true
  nan_ratio_trigger: 0.1
  max_nan_ratio_after: 0.5
  bottle_use_cylinder: true
  cylinder_radius_min_mm: 5.0
  cylinder_radius_max_mm: 60.0
  cylinder_min_valid_points: 50
bottle:
  enable_cylinder_pose: true
  axis_z_max: 0.57   # 2026-06-01 GT 13개로 재보정 (0.5→0.57). pickable algoZ≤0.535 / steep≥0.620 분리. project_bottle_tilt_gt_calibration
  min_valid_for_fit: 30
  known_radius_mm: 30.0   # 물병 본체 반경 실측값 3cm (2026-05-29). cap extrusion 복원/cylinder fit prior로 사용
  cap_len_mm: 15.0        # 뚜껑 길이 실측값 1.5cm (2026-05-29). 검출된 뚜껑 위치에 이 길이로 중앙정렬 배치
  length_mm: 145.0        # 병 전체 길이 (누운 병 관측 ~145mm). 세워진 병은 몸통이 안 보여 이 값으로 연장
  upright_aspect_max: 1.7 # 폴리곤 종횡비 이 이하 = 세워진 병(원형, 캡이 카메라 향함)
  radius_tolerance_mm: 5.0
  use_cap_pca_offset: false
  body_offset_mm: 30.0
  # 캡원 테두리 각도 커버리지 — confidence 신호 (곱셈 페널티, 하드 게이트 아님).
  # 캡 평면에서 축방향 ±slab_mm 슬랩을 잘라, 반경≈R(캡원 테두리) 점들이 캡원
  # 둘레를 얼마나 넓은 각도에 걸쳐 관측됐는지 측정. 한쪽 호에만 몰리면(투명/가림
  # 으로 캡 일부만 보임) 값↓ → bottle confidence를 곱셈으로 깎음. 2026-06-05
  cap_rim_coverage:
    enable: true
    slab_mm: 1.0            # 캡 평면 축방향 ±이 값(mm) 슬랩
    rim_tol_mm: 5.0         # |반경 - R| 이내면 테두리 점으로 인정(mm)
    n_bins: 36              # 캡원 둘레 각도 분할 수(10°)
    expected_arc_deg: 180.0 # 누운 병에서 보이는 호 — 정규화 기준(이만큼 덮으면 1.0)
    min_slab_points: 10     # 슬랩 점이 이보다 적으면 측정 불가 → 중립(페널티 없음)
    min_factor: 0.6         # coverage=0일 때 confidence에 곱해질 최소 배수(점수 floor)
heatmap:
  cup_radius_px: 18.0
