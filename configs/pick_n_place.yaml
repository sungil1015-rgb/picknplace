pipeline:
  fixed_focal_length: 2013.0
  use_fixed_focal_length: true
  segmentation_roi: [200.0, 1180.0, 0.0, 650.0]
  roi_source: config

polygon:
  approx_ratio: 0.005
  min_epsilon: 0.5

detector:
  type: mask2former
  config: ./configs/mask2former.yaml

classifier:
  type: dinov2
  config: ./configs/dinov2.yaml

priority:
  config: ./configs/grasp_priority.yaml

calibration:
  config: ./configs/calibration.yaml

suction:
  config: ./configs/suction.yaml
