suction:
  # class별 suction point 선택 방식.
  # normal: normal surface 기준, mask: 2D mask 후보점 기준, class4_bottle: 투명 물통 예외 로직.
  strategy:
    default: normal
    by_class:
      # 비닐류는 normal이 불안정하므로 2D mask 후보점을 사용한다.
      0: mask
      1: mask
      4: class4_bottle

  # dual suction cup 실제 규격(mm).
  cup:
    diameter_mm: 25.0
    center_spacing_mm: 35.0

  # 2D mask 기반 suction 후보점 생성.
  candidates:
    count: 8
    min_distance_px: 50.0
    pca_offset_px: 50.0

  # normal surface를 찾아 suction point를 면 중심으로 이동한다.
  normal_surface:
    enabled: true
    angle_threshold_deg: 13.0

    cluster:
      max_count: 5

    morphology:
      open_kernel_px: 1
      close_kernel_px: 1
      fill_holes_max_area_px: 50.0
      fill_holes_max_aspect_ratio: 4.0

    center:
      method: rect_center
      rect_max_area_ratio: 2.0

    min_region:
      area_ratio: 0.1
      area_px: 3000.0

    class3_depth_split:
      enabled: true
      min_gap_mm: 0.8
      trim_low_percentile: 1.0
      trim_high_percentile: 99.0
      cut_band_mm: 1.0
      bridge_open_kernel_px: 1
      line_cut_enabled: true
      line_cut_thickness_px: 7
      line_cut_min_aspect_ratio: 1.8
      min_layer_area_px: 300
      min_layer_area_ratio: 0.08
      min_component_area_px: 300

  # 실험/내부 튜닝값. 평소에는 위 strategy/cup/candidates/normal_surface 위주로 조정한다.
  advanced:
    # suction point 주변 depth/normal 계산 window(pixel).
    depth_window: 10
    normal_window: 20

    candidate_min_offset_px: 5.0
    candidate_clearance_offset_ratio: 0.8

    # 현재 footprint는 선택 reject 기준으로 쓰지 않고 debug/시각화용으로만 남긴다.
    footprint:
      min_cup_inside_ratio: 0.75
      min_object_coverage: 0.8
      min_surface_coverage: 0.5

    # normal surface의 장축을 구할 때 minAreaRect를 우선 사용하고, 불안정하면 PCA/object mask로 fallback한다.
    axis:
      min_area_px: 20
      min_rect_ratio: 1.2
      min_pca_ratio: 2.5
      reference_step_px: 20.0
