suction:
  # class별 suction point 선택 방식.
  # normal: normal surface 기준, mask: 2D mask 후보점 기준, class4_bottle: 투명 물통 예외 로직.
  strategy:
    default: normal
    by_class:
      # 비닐류는 normal이 불안정하므로 2D mask 후보점을 사용한다.
      0: mask
      1: mask
      4: class4_bottle

  # dual suction cup 실제 규격(mm).
  cup:
    diameter_mm: 25.0
    center_spacing_mm: 35.0

  # 2D mask 기반 suction 후보점 생성.
  candidates:
    count: 8
    min_distance_px: 50.0
    pca_offset_px: 50.0

  # normal surface를 찾아 suction point를 면 중심으로 이동한다.
  normal_surface:
    enabled: true
    angle_threshold_deg: 13.0

    cluster:
      max_count: 5

    morphology:
      open_kernel_px: 1
      close_kernel_px: 1
      fill_holes_max_area_px: 50.0
      fill_holes_max_aspect_ratio: 4.0

    center:
      method: rect_center
      rect_max_area_ratio: 2.0

    min_region:
      area_ratio: 0.1
      area_px: 3000.0

    class3_depth_split:
      enabled: true
      min_gap_mm: 0.8
      trim_low_percentile: 1.0
      trim_high_percentile: 99.0
      cut_band_mm: 1.0
      bridge_open_kernel_px: 1
      line_cut_enabled: true
      line_cut_thickness_px: 7
      line_cut_min_aspect_ratio: 1.8
      min_layer_area_px: 300
      min_layer_area_ratio: 0.08
      min_component_area_px: 300

  # 실험/내부 튜닝값. 평소에는 위 strategy/cup/candidates/normal_surface 위주로 조정한다.
  advanced:
    # suction point 주변 depth/normal 계산 window(pixel).
    depth_window: 10
    normal_window: 20

    candidate_min_offset_px: 5.0
    candidate_clearance_offset_ratio: 0.8

    # 현재 footprint는 선택 reject 기준으로 쓰지 않고 debug/시각화용으로만 남긴다.
    footprint:
      min_cup_inside_ratio: 0.75
      min_object_coverage: 0.8
      min_surface_coverage: 0.5

    # normal surface의 장축을 구할 때 minAreaRect를 우선 사용하고, 불안정하면 PCA/object mask로 fallback한다.
    axis:
      min_area_px: 20
      min_rect_ratio: 1.2
      min_pca_ratio: 2.5
      reference_step_px: 20.0

  # 단일컵 흡착 + 안정(겹침/충돌) 로직. cup_count_by_class 에서 1 인 클래스가 단일컵 경로를 탄다.
  single_cup:
    enabled: true
    cup_count_default: 2
    cup_count_by_class:
      0: 1            # haribo(구겨진 비닐백)
    min_cup_inside_ratio: 0.9
    flatness:         # 활성 컵 평탄/유효채움 (suction_plane_residual_check 재활용)
      # 2026-06-11 재보정: 잔차를 LSQ 피팅 평면 기준으로 측정 (single_cup.fit_disk_plane).
      # 하리보-only 37샷 165폴리곤 전수 커버 실측 요구치
      # (bump 11.1 / dent 21.2 / p95 10.0 / bad 0.76) + ~10% 여유.
      # dent 요구치 21mm는 호일 depth 스파이크 1건이 끌어올린 값 (해당 면 p95=3.2mm)
      # — 실제 굴곡 변별은 p95/bad_ratio 가 담당.
      max_bump_mm: 12.0
      max_dent_mm: 24.0
      max_abs_p95_mm: 11.0
      bad_residual_mm: 3.0
      max_bad_ratio: 0.8
      min_valid_ratio: 0.6
    exclusivity:      # 활성 컵이 옆 물체를 같이 빨지 않게
      seal_band_mm: 6.0
      max_neighbor_ratio: 0.05
    collision:        # 비활성 컵 "착좌면 위 솟음" 충돌 + 8방향 회전 회피
      protrusion_tol_mm: 5.0
      num_rotations: 8
      min_valid_ratio: 0.4
