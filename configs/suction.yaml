suction:
  # class별 suction point 선택 방식.
  # normal: normal surface 기준, mask: 2D mask 후보점 기준, class4_bottle: 투명 물통 예외 로직.
  strategy:
    default: normal
    by_class:
      4: class4_bottle

  # dual suction cup 실제 규격(mm).
  cup:
    diameter_mm: 25.0
    center_spacing_mm: 35.0

  # 박스 벽 근처에서는 suction z축이 벽 쪽으로 기울지 않도록 보정한다.
  collision_guard:
    enabled: true
    box_roi: [300.0, 1080.0, 0.0, 512.0]
    wall_margin_ratio: 0.10
    min_outward_wall_component: 0.15

  # normal surface를 찾아 suction point를 면 중심으로 이동한다.
  normal_surface:
    enabled: true
    # 방향과 상관없이 이 각도보다 많이 기울어진 normal surface는 버린다.
    max_robot_z_tilt_deg: 45.0
    candidate_max_count: 3
    # 최대 면적 후보가 다른 후보보다 이 배수 이상 크지 않으면 normal 분산이 낮은 후보를 우선한다.
    area_dominance_ratio: 1.5

    # allowed_robot_xy 반대 방향으로 기울어진 경우만 별도로 제한한다.
    directional_tilt:
      enabled: true
      allowed_robot_xy: [1.0, 0.0]
      # 이 각도 미만이면 반대 방향이어도 거의 수직으로 보고 허용한다.
      min_tilt_deg: 30.0
      # dot(normal_robot_xy_dir, allowed_robot_xy)가 이 값보다 작으면 반대 방향으로 본다.
      min_allowed_dot: 0.0

    # dual cup 두 영역의 depth median 차이가 크면 한쪽 컵만 먼저 닿는 상황으로 보고 버린다.
    suction_depth_check:
      enabled: false
      max_dual_cup_depth_diff_mm: 0.7
      min_cup_valid_ratio: 0.3

    kmeans:
      k: 2
      merge_angle_deg: 3.0
      n_init: 12
      max_iter: 100
      random_state: 0

    morphology:
      open_kernel_px: 1
      fill_holes_max_area_px: 5.0
      fill_holes_max_aspect_ratio: 3.0

    center:
      method: rect_center
      rect_max_area_ratio: 2.0

    min_region:
      area_ratio: 0.1
      area_px: 2000.0

    class3_depth_split:
      enabled: true
      min_gap_mm: 0.5
      trim_low_percentile: 1.0
      trim_high_percentile: 99.0
      cut_band_mm: 1.0
      bridge_open_kernel_px: 2
      line_cut_enabled: true
      line_cut_thickness_px: 3
      line_cut_min_aspect_ratio: 1.2
      min_layer_area_px: 300
      min_layer_area_ratio: 0.08
      min_component_area_px: 300

  # class4 투명 물통은 장축 양끝을 비교해서 depth가 안정적인 쪽을 뚜껑 후보로 본다.
  class4_bottle:
    cap_depth_percentile: 3.0
    cap_depth_band_mm: 15.0
    cap_anchor_percentile: 3.0
    cap_anchor_band_mm: 5.0
    min_cap_anchor_area_px: 30
    cap_open_kernel_px: 3
    cap_close_kernel_px: 7
    min_cap_area_px: 300
    cap_normal_window_px: 20
    min_cap_normal_pixels: 10
    point_source: mask_center
    endpoint_fraction: 0.142857
    endpoint_valid_ratio_margin: 0.12
    min_endpoint_valid_px: 30
    min_endpoint_valid_ratio: 0.85

  # 실험/내부 튜닝값. 평소에는 위 strategy/cup/candidates/normal_surface 위주로 조정한다.
  advanced:
    # suction point 주변 depth/normal 계산 window(pixel).
    depth_window: 10
    normal_window: 20
    normal_outlier_angle_deg: 30.0
    normal_min_valid_pixels: 20

    # normal surface의 장축을 구할 때 minAreaRect를 우선 사용하고, 불안정하면 PCA/object mask로 fallback한다.
    axis:
      min_area_px: 20
      min_rect_ratio: 1.2
      min_pca_ratio: 2.5
      reference_step_px: 20.0
