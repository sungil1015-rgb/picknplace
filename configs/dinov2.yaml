classifier:
  enabled: true
  model_name: facebook/dinov2-large
  use_fast: true
  reference_bank: weights/dinov2_reference_bank_crops_large2/all_reference_bank.pt
  top_k: 5
  crop_padding: 0
  masked_crop: true
  masked_crop_background: 127
  cls_weight: 0.7
  patch_mean_weight: 0.3
  patch_mean_source: masked
  rgb_weight: 0.8
  gray_weight: 0.2
  knn_temperature: 0.03
  min_class_score: 0.5
  min_similarity: 0.6
  min_vote_ratio: 0.6
  min_margin: 0.025
  # Optional per-class overrides. Missing classes fall back to the global values above.
  min_class_score_by_class: {}
  min_similarity_by_class:
    2: 0.55
    3: 0.55
  min_vote_ratio_by_class: {}
  min_margin_by_class: 
    0: 0.003
